<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Bitwise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .w11-spinner {
      width: 16px; height: 16px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-[#0f0f0f] text-[#f2f2f2] font-sans flex justify-center items-center h-screen m-0">

  <div class="bg-[#1c1c1e] w-full max-w-[400px] p-6 rounded-[24px] shadow-2xl">
    <h2 class="mt-0 mb-6 text-[22px] font-bold">Rede</h2>
    
    <!-- Seletor de Classes -->
    <div id="classSelector" class="flex bg-black rounded-xl p-1 mb-5">
      <!-- As cores de 'ativo' e 'inativo' serão controladas pelo JS -->
      <button class="class-btn active flex-1 bg-[#1c1c1e] text-[#f2f2f2] p-2.5 rounded-lg cursor-pointer font-semibold transition-colors" data-class="A">Classe A</button>
      <button class="class-btn flex-1 bg-transparent text-[#8e8e93] p-2.5 rounded-lg cursor-pointer font-semibold transition-colors" data-class="B">Classe B</button>
      <button class="class-btn flex-1 bg-transparent text-[#8e8e93] p-2.5 rounded-lg cursor-pointer font-semibold transition-colors" data-class="C">Classe C</button>
    </div>

    <!-- Inputs -->
    <div class="flex flex-col gap-4 mb-5">
      <div>
        <label for="ipInput" class="text-[13px] text-[#8e8e93] mb-2 block">Endereço IP</label>
        <input type="text" id="ipInput" class="w-full bg-black border border-[#333] text-[#f2f2f2] p-4 rounded-xl text-base outline-none focus:border-[#3b82f6] transition-colors" placeholder="Ex: 192.168.10.85">
      </div>

      <div>
        <label for="maskInput" class="text-[13px] text-[#8e8e93] mb-2 block">Máscara ou CIDR</label>
        <input type="text" id="maskInput" class="w-full bg-black border border-[#333] text-[#f2f2f2] p-4 rounded-xl text-base outline-none focus:border-[#3b82f6] transition-colors" placeholder="Ex: 255.255.255.0 ou 24">
      </div>
    </div>

    <div id="resultsPopup" class="bg-[#1c1c1e] border border-[#3b82f6] p-4 rounded-xl mb-4 hidden shadow-lg">
      <span class="text-[#f2f2f2] text-sm">Aqui entrarão os resultados depois...</span>
    </div>

    <!-- Caixa de Aviso / Erro / Sucesso -->
    <div id="statusMsg" class="hidden p-3 rounded-xl mb-4 text-[13px] font-semibold text-center border"></div>

    <button id="btnCalcular" class="w-full bg-[#3b82f6] text-white border-none p-4 rounded-[24px] text-base font-semibold cursor-pointer hover:bg-blue-600 transition-colors">Calcular</button>

    <!-- Resultados -->
    <div id="resultsArea" class="mt-6 pt-5 border-t border-[#333] hidden">
      <div class="flex justify-between mb-3 text-sm"><span class="text-[#8e8e93]">IP:</span> <span id="resIp">-</span></div>
      <div class="flex justify-between mb-3 text-sm"><span class="text-[#8e8e93]">Máscara:</span> <span id="resMask">-</span></div>
      <div class="flex justify-between mb-3 text-sm"><span class="text-[#8e8e93]">Rede:</span> <span id="resNet">-</span></div>
      <div class="flex justify-between mb-3 text-sm"><span class="text-[#8e8e93]">Broadcast:</span> <span id="resBroad">-</span></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
